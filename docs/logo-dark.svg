<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 72" role="img" aria-label="Saolrian">
  <!-- Mark: track ring with a gap; a dot sets off around it. saol = life, rian = track. -->
  <g transform="translate(4,4)">
    <path d="M 49.66 41.39 A 20 20 0 1 1 49.66 22.61"
          fill="none" stroke="#ffffff" stroke-width="6.5" stroke-linecap="round"/>
    <circle cx="47.6" cy="19.6" r="5.5" fill="#ffffff"/>
  </g>
  <!-- Wordmark -->
  <text x="72" y="47" font-family="'Inter Tight','Inter',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif"
        font-size="34" font-weight="600" letter-spacing="-0.5" fill="#ffffff">Saolrian</text>
</svg>
