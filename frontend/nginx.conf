server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: let client-side routes resolve to the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-cache hashed assets; never cache the HTML shell or the SW.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }
}